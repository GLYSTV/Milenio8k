name: Build ULTRA4K Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build ULTRA4K APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      # Llave de firma FIJA: necesaria para que las actualizaciones automáticas se puedan instalar encima.
      # Secrets del repositorio: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Preparar llave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ultra4k.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/ultra4k.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Falta el secret KEYSTORE_BASE64: se generará un APK debug y las actualizaciones automáticas no podrán instalarse encima."
          fi

      - name: Build APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash build-glystv-v3.sh

      - name: Save APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ULTRA4K-apk
          path: dist/ULTRA4K.apk

      # El tag apk-<número> es el que la app compara con su propia versión para avisar de actualizaciones.
      - name: Upload APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: ULTRA4K APK ${{ github.run_number }}
          files: dist/ULTRA4K.apk
          make_latest: true
          
