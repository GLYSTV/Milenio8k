name: Build ULTRA4K Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build ULTRA4K APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Copy hls.js
        run: cp node_modules/hls.js/dist/hls.min.js www/hls.min.js

      - name: Add Android
        run: npx cap add android

      - name: Apply icon
        run: bash icons/apply.sh

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ULTRA4K-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: ULTRA4K APK ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
