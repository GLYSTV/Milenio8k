name: Build Android + iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Build Android
        run: bash build-glystv-v3.sh

      - name: Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: GLYSTV APK ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    name: Build iOS iPhone/iPad
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets for iOS
        run: |
          rm -rf www ios
          mkdir -p www
          cp index.html www/
          if [ -f logo.png ]; then cp logo.png www/; fi

      - name: Add Capacitor iOS
        run: npx cap add ios

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build unsigned iOS app
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package iOS app
        run: |
          cd ios/App/build/Build/Products/Debug-iphoneos
          zip -r ../../../../GLYSTV-iOS-unsigned.zip App.app

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: GLYSTV-iOS-unsigned
          path: ios/App/GLYSTV-iOS-unsigned.zip
          if-no-files-found: error
          
